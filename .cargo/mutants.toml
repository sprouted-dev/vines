# cargo-mutants configuration, read by `just mutants`, `just mutants-touched`
# (scripts/mutants-in-diff.sh) and any `cargo mutants` run in this checkout.

test_tool = "nextest"
# The nextest `mutants` profile (.config/nextest.toml) stops at the first
# failing test and kills a hung one at 5s.
additional_cargo_test_args = ["--profile", "mutants"]

# Each exclusion removes mutants that say nothing about whether behavior is
# tested. Add one only with a reason beside it; a mutant that is merely hard
# to kill belongs in a test, not here.
exclude_re = [
  # Debug output is for humans reading logs and test failures; no behavior
  # depends on it.
  '<impl (std::|core::)?(fmt::)?Debug for ',
  # The tail-gap merge guard is never false in a reachable state: an
  # outlet has one overflow policy, so one gap reason (ObserverFailed only
  # after a spill failure, which ends SpillExhausted for good), and every
  # offer either queues an item (flushing the tail gap), extends the gap, or
  # is discarded once the outlet is released or ended. So the gap is always
  # contiguous, and mutants that make the guard true change nothing. The
  # mutants that make it false are caught.
  '(match guard .*|&& with \|\|) in State<P>::extend_tail_gap',
  # vine-lang's checker asks whether an operator at index i stands before
  # the last catchError, finalize, retry or timeout of its pipe (index c)
  # with `i < c`. The operator at c is one of those four, and the loop
  # handles it and moves on before this test, so i is never c there, and
  # `i <= c` decides the same for every pipe.
  "replace < with <= in Checker<'_>::pipe",
]
