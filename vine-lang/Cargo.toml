[package]
name = "vine-lang"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Executable proof of the vine language: YAML vines run over Rust operators."
publish = false

[lints]
workspace = true

[lib]
name = "vine_lang"
path = "src/lib.rs"

[features]
# The YAML layer. With it off, the crate is the Rust core alone: vines are
# built with `vine_lang::pipe` and no YAML parser is compiled in.
default = ["yaml"]
yaml = ["dep:serde_yaml"]

[dependencies]
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
serde_json = "1.0.149"
serde_yaml = { version = "0.9.34", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "time", "sync", "macros", "test-util"] }
