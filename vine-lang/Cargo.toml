[package]
name = "vine-lang"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Executable proof of the vine language: YAML vines run over Rust operators."
publish = false

# Standalone: not a member of the terra-vines crate at the repo root.
[workspace]

[lib]
name = "vine_lang"
path = "src/lib.rs"

[dependencies]
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio-util = { version = "0.7.18", default-features = false }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "time", "sync", "macros", "test-util"] }
