# Say which of a plan's jobs can be launched now: ready, waiting on
# nothing, and not yet asked for. The vine names them. It launches
# nothing. Whether the plan is active is declared on the move.
vine: plan_launch_ready
mode: once
input: { plan: id, jobs: list }
outputs:
  ready: { plan: id, jobs: list }
  nothing_ready: { plan: id }
steps:
  - select:
      from: $in.jobs
      where: { state: ready, waiting_on: 0, asked: false }
    as: launchable
  - guard: { when: $launchable.count == 0, out: nothing_ready, with: { plan: $in.plan } }
  - out: { name: ready, with: { plan: $in.plan, jobs: $launchable.items } }
