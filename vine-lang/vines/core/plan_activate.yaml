# Activate a plan: cut its branch from the base and make the working copy
# the plan's jobs are merged into. Whether the plan may be activated is
# declared on the move, not here.
vine: plan_activate
mode: once
input: { plan: id, base: text }
outputs:
  activated: { plan: id, branch: text, lane: text }
  failed: { plan: id, reason: text }
steps:
  - try:
      do:
        - call: git.branch_cut
          with: { name: $in.plan, from: $in.base }
          as: branch
        - call: git.worktree_add
          with: { name: $in.plan, from: $branch.name }
          as: lane
        - out:
            name: activated
            with: { plan: $in.plan, branch: $branch.name, lane: $lane.path }
      on_error:
        - out: { name: failed, with: { plan: $in.plan, reason: $error.message } }
