# Launch a job: bring the plan branch up to date, make the job a working
# copy, and start an agent in it. The vine ends as soon as the agent has
# started. It does not wait for the agent to finish. `job_session_ended`
# picks up from there.
#
# The vine has no gates. Whether the job may be launched at all (it is
# ready, its plan is active, its dependencies are done, no session is
# live) is declared on the move and checked by whoever runs the vine.
vine: job_launch
mode: once
input: { job: id, plan_branch: text, brief: text }
outputs:
  started: { job: id, session: text, tree: text }
  failed: { job: id, reason: text }
steps:
  - try:
      do:
        - call: git.refresh_branch
          with: { branch: $in.plan_branch }
        - call: git.worktree_add
          with: { name: $in.job, from: $in.plan_branch }
          as: tree
        - try:
            do:
              - call: agent.start
                with: { dir: $tree.path, brief: $in.brief }
                as: session
              - out:
                  name: started
                  with: { job: $in.job, session: $session.id, tree: $tree.path }
            on_error:
              # The agent never started, so nothing will ever report its
              # end. Remove the working copy here.
              - call: git.worktree_remove
                with: { path: $tree.path }
              - out: { name: failed, with: { job: $in.job, reason: $error.message } }
      on_error:
        - out: { name: failed, with: { job: $in.job, reason: $error.message } }
