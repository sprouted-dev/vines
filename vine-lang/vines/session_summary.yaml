# Summarise one agent session's output as it streams: every 50 lines, or
# 30 seconds after the first line of a batch, an updated summary; at end
# of stream, the final one. The summary so far is kept memory.
vine: session_summary
mode: stream
input: { line: text }
outputs:
  summary: { text: text, lines: int, final: bool }
steps:
  - collect: { size: 50, or_every: 30s }
  - summarise: { field: line }
