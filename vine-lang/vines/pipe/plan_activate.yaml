# Activate a plan: cut its branch from the base and make the working copy
# the plan's jobs are merged into.
vine: plan_activate
input: { plan: id, base: text }
outputs:
  activated: { plan: id, branch: text, lane: text }
  failed: { plan: id, reason: text }
pipe:
  - call: git.branch_cut
    with: { name: $item.plan, from: $item.base }
    into: branch
  - call: git.worktree_add
    with: { name: $item.plan, from: $item.branch.name }
    into: lane
  - emit:
      to: activated
      with: { plan: $item.plan, branch: $item.branch.name, lane: $item.lane.path }
  - catch:
      - emit: { to: failed, with: { plan: $item.plan, reason: $item.error.message } }
