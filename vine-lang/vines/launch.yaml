# Launch a ready job: make a working copy, run an agent in it, and always
# release the working copy, however the agent run ends.
vine: launch
mode: once
input: { job: id }
outputs:
  launched: { job: id, session: text }
  failed: { job: id, reason: text }
  refused: { gate: text }
steps:
  - read: { artifact: $in.job }
    as: job
  - guard: { when: $job == null, out: refused, with: { gate: missing } }
  - guard: { when: $job.state != "ready", out: refused, with: { gate: state } }
  - worktree: { branch: $job.branch }
    as: tree
  - try:
      do:
        - agent_run: { dir: $tree.path, brief: $job.brief }
          as: run
        - switch:
            on: $run.status
            cases:
              completed:
                - out: { name: launched, with: { job: $in.job, session: $run.session } }
            else:
              - out: { name: failed, with: { job: $in.job, reason: $run.reason } }
      catch:
        agent:
          - out: { name: failed, with: { job: $in.job, reason: $error.message } }
      finally:
        - worktree_release: { path: $tree.path }
